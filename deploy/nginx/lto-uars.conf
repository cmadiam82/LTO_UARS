server {
    listen 3300;
    listen [::]:3300;
    server_name _;

    access_log /var/log/nginx/lto-uars.access.log;
    error_log /var/log/nginx/lto-uars.error.log;
    # Five attachments at 10 MB each, plus multipart overhead.
    client_max_body_size 55m;

    location / {
        # Prevent an open administrator session from reusing an obsolete form
        # after a versioned deployment. Hashed assets remain small enough for
        # the internal network to revalidate safely.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        # Preserve :3300 so Vinext's Origin/Host CSRF comparison succeeds.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
